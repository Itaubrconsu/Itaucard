<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Interface Credicard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <!-- CABEÇALHO -->
    <header class="header">

        <div class="user-info">

            <div class="avatar">
                LF
            </div>

            <div class="user-details">
                <strong>Liliam fidelis.</strong>
                <span>CPF: ***.***.209-60</span>
            </div>

        </div>

        <button class="exit-btn">
            <span>➜</span>
            Sair
        </button>

    </header>


    <!-- CARTÃO -->
    <section class="card">

        <div class="card-header">
            <span class="brand-name">
                Credicard Itau
            </span>

            <button class="hide-btn">
                ocultar
                <span>⌃</span>
            </button>
        </div>


        <div class="card-details">

            <div class="mastercard">
                <span></span>
                <span></span>
            </div>

            <div class="info-text">
                final 8292<br>
                melhor data de compra 06<br>
                fatura aberta
            </div>

        </div>


        <div class="divider"></div>


        <div class="vencimento">
            2 Outubro 
        </div>

        <div class="valor-fatura">
            R$ 17.960,00
            <small>valor parcial</small>
        </div>


        <div class="divider"></div>


        <!-- LIMITE -->
        <div class="limit-labels">
            <span>limite utilizado</span>
            <span>disponível</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

        <div class="limit-values">
            <span>R$ 50,00 Devendo</span>
            <span>R$ 17.960,00</span>
        </div>


        <div class="card-tabs">
            <button class="tab active">
                fatura
            </button>

            <button class="tab">
                transferência
            </button>
        </div>

    </section>


    <!-- AÇÕES PRINCIPAIS -->
    <section class="action-buttons">

        <button
            class="action-btn"
            onclick="mostrarAcao('PIX Parcelado')">

            <span class="action-icon">↗</span>

            <span class="action-content">
                <strong>PIX Parcelado</strong>
                <small>Faça seu PIX em parcelas</small>
            </span>

            <span class="arrow">›</span>

        </button>


        <button
            class="action-btn"
            onclick="mostrarAcao('Ver extrato')">

            <span class="action-icon">▤</span>

            <span class="action-content">
                <strong>Ver extrato</strong>
                <small>Confira suas movimentações</small>
            </span>

            <span class="arrow">›</span>

        </button>


        <button
            class="action-btn"
            onclick="mostrarAcao('Consultar limite')">

            <span class="action-icon">▣</span>

            <span class="action-content">
                <strong>Consultar limite</strong>
                <small>Veja seu limite disponível</small>
            </span>

            <span class="arrow">›</span>

        </button>

    </section>


    <!-- MENSAGEM -->
    <div
        id="actionMessage"
        class="action-message">
    </div>


    <!-- OUTROS MENUS -->
    <button class="menu-item">

        <span class="menu-icon">
            ✦
        </span>

        <span>
            pontos
        </span>

        <span class="menu-arrow">
            ›
        </span>

    </button>


    <button class="menu-item">

        <span class="menu-icon">
            ⓘ
        </span>

        <span>
            atendimento digital
        </span>

        <span class="menu-arrow">
            ›
        </span>

    </button>

</main>


<script src="script.js"></script>

</body>
</html>
