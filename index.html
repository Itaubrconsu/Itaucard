
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ItauCard </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <main class="app">
    <header class="profile">
      <div class="avatar">LA</div>
      <div class="user">
        <strong>Lucas Almeida</strong>
        <small>Conta Cnpj 113*568***</small>
      </div>
      <button class="logout" onclick="alert('Área demonstrativa')">➜</button>
    </header>

    <section class="credit-card">
      <div class="card-header">
        <h2>ItauCard</h2>
        <button id="toggleBalance">ocultar⌃</button>
      </div>

      <div class="card-info">
        <div class="fake-logo">
          <span></span><span></span>
        </div>
        <p>cartão final 8572</p>
        <p>melhor data de compra 15</p>
        <p>fatura aberta</p>
      </div>

      <div class="invoice">
        <small>27 Novembro</small>
        <div class="amount-line">
          <strong class="money">R$ 19.950,00</strong>
          <span>valor parcial</span>
        </div>
      </div>

      <div class="limit">
        <div class="limit-label">
          <span>limite utilizado</span>
          <span>disponível</span>
        </div>

        <div class="bar">
          <div class="progress"></div>
        </div>

        <div class="limit-values">
          <strong class="used">R$ 160,90 Devendo</strong>
          <strong class="available">R$ 19.950,00</strong>
        </div>
      </div>

      <div class="card-footer">
        <span>fatura</span>
        <span>transferência</span>
      </div>
    </section>

    <section class="actions">
      <button class="action" onclick="showMessage('Área de demonstração')">
        <div class="action-icon">↗</div>
        <div class="action-text">
          <strong>PIX Parcelado</strong>
          <small>Faça seu PIX em parcelas</small>
        </div>
        <span class="arrow">›</span>
      </button>

      <button class="action" onclick="showMessage('Extrato fictício')">
        <div class="action-icon">▤</div>
        <div class="action-text">
          <strong>Ver extrato</strong>
          <small>Última movimentação via pix 11:04</small>
        </div>
        <span class="arrow">›</span>
      </button>

      <button class="action" onclick="showMessage('Limite de demonstração')">
        <div class="action-icon">▣</div>
        <div class="action-text">
          <strong>Consultar limite</strong>
          <small>Veja seu limite disponível</small>
        </div>
        <span class="arrow">›</span>
      </button>

      <button class="action points" onclick="showMessage('Pontos fictícios')">
        <div class="star">✦</div>
        <div class="action-text">
          <strong>pontos</strong>
        </div>
        <span class="arrow">›</span>
      </button>
    </section>

    <div id="toast"></div>
    <footer>BluePay • Interface fictícia para demonstração</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
